name: Pages preview
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions: inherit
    steps:
      - id: deployment
        uses: actions/deploy-pages@v3
        with:
          preview: true
      - name: Comment preview URL
        if: ${{ github.event.pull_request }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "📄 **Preview**: ${{ steps.deployment.outputs.page_url }}"
        env:
          GH_TOKEN: ${{ github.token }}
